<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070914" />
  <title>Galaxy Birthday Cake</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f7ff;
      --muted: rgba(226, 224, 255, .66);
      --violet: #9f83ff;
      --cyan: #72ddff;
      --gold: #ffd88a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05060d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
    }

    .experience {
      position: relative;
      width: min(100vw, 56.25vh);
      height: min(100svh, 177.7778vw);
      min-width: min(100vw, 56.25vh);
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 65% 46%, rgba(111, 72, 207, .17), transparent 31%),
        radial-gradient(circle at 83% 76%, rgba(225, 136, 158, .07), transparent 25%),
        radial-gradient(circle at 32% 28%, rgba(40, 76, 135, .10), transparent 33%),
        linear-gradient(145deg, #050713 0%, #090a1d 47%, #10091c 72%, #04050d 100%);
    }

    .experience::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background:
        linear-gradient(180deg, rgba(4, 5, 12, .28), transparent 18%, transparent 78%, rgba(2, 3, 10, .45)),
        radial-gradient(ellipse at center, transparent 46%, rgba(0, 0, 0, .32) 100%);
      mix-blend-mode: multiply;
    }

    .experience::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 7;
      opacity: .22;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
    }

    .copy {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      color: var(--ink);
      text-align: center;
    }

    .eyebrow {
      position: absolute;
      top: max(3.2%, env(safe-area-inset-top));
      left: 50%;
      margin: 0;
      transform: translate(-50%, 10px);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(9px, 1.15vh, 12px);
      font-weight: 400;
      letter-spacing: .24em;
      text-indent: .24em;
      white-space: nowrap;
      color: rgba(247, 213, 160, .66);
      opacity: 0;
      transition: opacity 1s ease, transform 1s ease;
    }

    .copy.show-intro .eyebrow {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .final-message {
      position: absolute;
      left: 7.5%;
      right: 7.5%;
      top: 7.2%;
      display: grid;
      justify-items: center;
      opacity: 0;
      transform: translateY(18px);
      filter: blur(8px);
      transition: opacity 1.2s cubic-bezier(.2,.75,.2,1), transform 1.2s cubic-bezier(.2,.75,.2,1), filter 1.2s ease;
    }

    .copy.show-final .final-message {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    .title {
      margin: 0;
      font-family: Didot, "Bodoni 72", "Bodoni MT", "Times New Roman", Georgia, serif;
      font-size: clamp(38px, 6.9vh, 72px);
      font-weight: 400;
      line-height: .84;
      letter-spacing: -.055em;
      text-wrap: balance;
      color: #fff4e5;
      background: linear-gradient(135deg, #fffaf1 5%, #f6d5aa 58%, #f2c5cf 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 217, 163, .09);
    }

    .recipient {
      margin: clamp(11px, 1.55vh, 17px) 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(11px, 1.45vh, 16px);
      font-weight: 400;
      letter-spacing: .13em;
      text-indent: .13em;
      color: #f4d19a;
    }

    .wish {
      position: relative;
      max-width: 26em;
      margin: clamp(14px, 1.9vh, 22px) 0 0;
      padding-bottom: 9px;
      font-family: "STXingkai", "KaiTi", "FangSong", serif;
      font-size: clamp(14px, 1.9vh, 21px);
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: .08em;
      color: #f2ca8c;
      text-wrap: balance;
    }

    .wish::after {
      content: "";
      position: absolute;
      left: 9%; right: 9%; bottom: 0;
      height: 8px;
      opacity: .62;
      border-bottom: 1px solid rgba(238, 190, 122, .75);
      border-radius: 50%;
      transform: rotate(-1.6deg) skewX(-18deg);
    }

    .message-en {
      max-width: 34em;
      margin: 10px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(9px, 1.15vh, 12px);
      font-style: italic;
      line-height: 1.55;
      letter-spacing: .05em;
      color: rgba(231, 216, 211, .48);
    }

    .birthday-date {
      margin: 8px 0 0;
      font-size: 8px;
      letter-spacing: .28em;
      color: rgba(240, 203, 145, .4);
    }

    .wish-action {
      position: absolute;
      z-index: 8;
      left: 50%;
      bottom: max(5.4%, calc(env(safe-area-inset-bottom) + 10px));
      margin: 0;
      padding: 9px 18px 10px;
      border: 1px solid rgba(247, 206, 148, .38);
      border-radius: 999px;
      background: linear-gradient(105deg, rgba(245, 197, 134, .9), rgba(238, 171, 204, .88));
      color: #24152d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      letter-spacing: .08em;
      cursor: pointer;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 8px);
      box-shadow: 0 8px 28px rgba(235, 166, 195, .12), inset 0 1px rgba(255,255,255,.55);
      transition: transform .55s ease, opacity .55s ease, box-shadow .3s ease, filter .3s ease;
    }

    .wish-action.visible { opacity: 1; pointer-events: auto; transform: translate(-50%,0); }
    .wish-action:hover { transform: translate(-50%,-2px); filter: brightness(1.06); box-shadow: 0 11px 34px rgba(235, 166, 195, .2); }
    .wish-action:focus-visible { outline: 2px solid #f9dcaa; outline-offset: 3px; }
    .wish-action .spark { display: inline-block; margin-right: 7px; }

    .secret-message {
      position: absolute;
      z-index: 8;
      left: 8%; right: 8%;
      bottom: 10.5%;
      margin: 0;
      text-align: center;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      font-family: Georgia, "KaiTi", serif;
      font-size: 10px;
      letter-spacing: .06em;
      color: rgba(255, 234, 207, .7);
      transform: translateY(5px);
      transition: max-height .7s ease, opacity .7s ease, transform .7s ease;
    }

    .secret-message.visible { max-height: 3em; opacity: 1; transform: translateY(0); }

    .progress {
      position: absolute;
      z-index: 6;
      top: 0;
      left: 0;
      height: 2px;
      width: 0;
      opacity: .5;
      background: linear-gradient(90deg, transparent, var(--violet), var(--cyan));
      box-shadow: 0 0 10px var(--violet);
    }

    .replay {
      position: absolute;
      z-index: 9;
      top: max(3.2%, env(safe-area-inset-top));
      right: 4.5%;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(10, 12, 28, .35);
      color: rgba(255,255,255,.58);
      display: grid;
      place-items: center;
      opacity: 0;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: opacity .5s ease, border-color .25s ease, color .25s ease, transform .25s ease;
    }

    .replay.visible { opacity: 1; }
    .replay:hover { color: #fff; border-color: rgba(255,255,255,.34); transform: rotate(-18deg); }
    .replay:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    .replay svg { width: 15px; height: 15px; }

    .hint {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 2.2%;
      transform: translateX(-50%);
      margin: 0;
      font-size: 9px;
      letter-spacing: .16em;
      white-space: nowrap;
      color: rgba(255,255,255,.23);
      opacity: 0;
      transition: opacity .8s ease;
      pointer-events: none;
    }

    .hint.visible { opacity: 1; }

    @media (min-aspect-ratio: 4/5) {
      .experience {
        width: 100vw;
        height: 100svh;
        min-width: 0;
      }

      .final-message {
        left: 7.7%;
        right: 59%;
        top: 50%;
        bottom: auto;
        transform: translateY(calc(-50% + 18px));
        text-align: left;
        justify-items: start;
      }

      .copy.show-final .final-message { transform: translateY(-50%); }
      .title { font-size: clamp(62px, 7.1vw, 112px); line-height: .86; }
      .wish { max-width: 25em; font-size: clamp(19px, 1.7vw, 28px); }
      .message-en { font-size: clamp(11px, .92vw, 15px); }
      .wish-action { padding: 11px 23px 12px; font-size: 13px; }
      .wish-action { left: 7.7%; bottom: 22%; transform: translate(0,8px); }
      .wish-action.visible { transform: translate(0,0); }
      .wish-action:hover { transform: translate(0,-2px); }
      .secret-message { left: 7.7%; right: 59%; bottom: 16.5%; text-align: left; }
      .eyebrow { left: 7.8%; top: 4.5%; transform: translate(0, 10px); }
      .copy.show-intro .eyebrow { transform: translate(0, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .final-message, .eyebrow, .replay { transition-duration: .01ms; }
    }
  
/* V2: a second chapter, while preserving the original cake scene. */
.wish-reveal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:30px;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;background:radial-gradient(ellipse at 50% 40%,#342254bb,#090b22b0 65%);backdrop-filter:blur(3px);overflow:hidden}.wish-reveal.active{opacity:1;visibility:visible;pointer-events:auto}.wish-reveal-inner{position:relative;z-index:2;text-align:center;max-width:600px;transform:translateY(25px) scale(.97);transition:transform 1s cubic-bezier(.2,.65,.3,1);color:#fff5de}.wish-reveal.active .wish-reveal-inner{transform:none}.wish-small{font-size:10px;letter-spacing:.35em;color:#d5c2ff;margin:0 0 24px}.wish-symbol{font-size:60px;display:block;color:#ffdf9d;text-shadow:0 0 40px #f9dc88aa;line-height:1.5;margin:0 0 17px}.wish-reveal h2{font-family:Georgia,'KaiTi',serif;font-size:clamp(26px,4vw,48px);font-weight:500;line-height:1.6;margin:0 0 20px;letter-spacing:.1em}.wish-reveal-message{font-family:'KaiTi',serif;font-size:clamp(19px,2vw,27px);line-height:1.9;color:#f8e6c9;margin:0 auto 30px;max-width:23em;white-space:pre-line;overflow-wrap:anywhere}.wish-return{padding:13px 26px;border:1px solid #f6d49d8c;border-radius:30px;background:linear-gradient(110deg,#eec48e,#dcb7e2);color:#332039;font-size:13px;cursor:pointer}.wish-return:focus-visible{outline:2px solid #fff;outline-offset:5px}.wish-afterword{font-size:10px;letter-spacing:.14em;color:#c8b8d8;line-height:1.9;margin:23px 0 0}.wish-halo{position:absolute;left:50%;top:45%;width:min(72vw,580px);aspect-ratio:1;border:1px solid #d9c3893b;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 90px #d9a85a1c,inset 0 0 90px #b996ed20;pointer-events:none}.wish-halo:before,.wish-halo:after{content:'';position:absolute;inset:9%;border:1px dashed #decf9c38;border-radius:50%}.wish-halo:after{inset:-10%;border-style:solid;border-color:#b6a2df1f}.wish-dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}.wish-dust i{font-style:normal;position:absolute;color:#fce3a5;opacity:0;text-shadow:0 0 12px #ffdf9b;animation:wish-rise 4.8s ease-out both;animation-delay:var(--delay);left:var(--x);top:var(--y);font-size:var(--size)}@keyframes wish-rise{0%{opacity:0;transform:translateY(50px) scale(.3) rotate(0)}20%{opacity:.95}75%{opacity:.65}100%{opacity:0;transform:translateY(-100px) scale(1) rotate(100deg)}}.experience.wish-phase .copy,.experience.wish-phase .wish-action{opacity:.15;transition:opacity .7s}.wish-reveal[aria-hidden=true]{pointer-events:none}@media(max-width:600px){.wish-reveal{padding:26px}.wish-reveal h2{font-size:29px;letter-spacing:.04em}.wish-reveal-message{font-size:21px;max-width:15em}.wish-halo{width:92vw}.wish-symbol{font-size:51px}.wish-small{font-size:8px}}@media(prefers-reduced-motion:reduce){.wish-reveal,.wish-reveal-inner{transition:none}.wish-dust i{animation:none;opacity:.7}}
@media(max-width:700px){.experience::after{display:none}.wish-reveal{backdrop-filter:none;background:radial-gradient(ellipse at 50% 40%,#342254ed,#090b22f5 65%)}}
.wish-reveal.active{transition:opacity .7s;visibility:visible}
</style>
</head>
<body>
  <a href="contact.html?product=birthday#brief" style="position:fixed;z-index:30;top:14px;left:14px;padding:9px 15px;border:1px solid #f7d7aa77;border-radius:999px;background:#151126b8;color:#fff1dd;font:12px system-ui,sans-serif;text-decoration:none;backdrop-filter:blur(8px)">开始定制 ↗</a>
  <main class="experience" id="experience" aria-label="银河生日蛋糕动画">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="progress" id="progress"></div>

    <section class="copy" id="copy" aria-live="polite">
      <p class="eyebrow" id="eyebrow">✦ FOR SOMEONE SPECIAL</p>
      <div class="final-message">
        <h1 class="title" id="title">Happy<br>Birthday</h1>
        <p class="recipient" id="recipient">TO XXX ♡</p>
        <p class="wish" id="wish">愿新的一岁，<br>始终开心、平安、喜乐。</p>
        <p class="message-en" id="messageEn">Wishing you a year filled with joy, love and beautiful moments.</p>
        <p class="birthday-date" id="birthdayDate">2026.09.18</p>
      </div>
    </section>

    <button class="wish-action" id="wishButton" type="button"><span class="spark">✦</span>Make a Wish</button>
    <p class="secret-message" id="secretMessage">这一刻，整片星河都在为你闪耀。</p>

    <button class="replay" id="replay" type="button" aria-label="重新播放动画" title="重新播放">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
      </svg>
    </button>
    <p class="hint" id="hint">轻触星空 · 收下一颗流星</p>
    <section class="wish-reveal" id="wishReveal" aria-hidden="true" inert role="dialog" aria-modal="true" aria-labelledby="wishRevealTitle"><div class="wish-halo" aria-hidden="true"></div><div class="wish-dust" id="wishDust" aria-hidden="true"></div><div class="wish-reveal-inner"><p class="wish-small">A LITTLE WISH, A WHOLE GALAXY</p><span class="wish-symbol" aria-hidden="true">✦</span><h2 id="wishRevealTitle">愿望已被星河收藏。</h2><p class="wish-reveal-message" id="wishRevealText"></p><button class="wish-return" id="wishReturn" type="button">收下这片星河 ♡</button><p class="wish-afterword">愿你所期待的，<br>在往后的日子里，慢慢发生。</p></div></section>
  </main>

  <script>
    /* ============================================================
       GALAXY BIRTHDAY CAKE · QUICK CUSTOMIZATION
       以后定制生日祝福，通常只需修改下面这个 CONFIG 对象。
       ============================================================ */
    const CONFIG = {
      name: "XXX",
      messageCN: "愿新的一岁，\n始终开心、平安、喜乐。",
      messageEN: "Wishing you a year filled with joy, love and beautiful moments.",
      hiddenWish: "这一刻，整片星河都在为你闪耀。",
      birthday: "2026.09.18",
      theme: "galaxy",
      greeting: "Happy Birthday",
      eyebrow: "✦  FOR SOMEONE SPECIAL",
      primary: "#9f83ff",
      secondary: "#72ddff",
      accent: "#ffd88a",
      duration: 7000,        // 开场动画；许愿按钮出现后持续保留
      loop: false,             // 结尾停留，用户可以主动重播
      loopPause: 3.8,         // 循环前的结尾停留秒数
      interactiveSparkles: true
    };

    const TAU = Math.PI * 2;
    const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
    const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
    const smoothstep = (a, b, v) => { const t = clamp((v-a)/(b-a)); return t*t*(3-2*t); };
    const fadeWindow = (t, start, end, fade = .08) => smoothstep(start, start+fade, t) * (1-smoothstep(end-fade, end, t));

    const hexToRgb = hex => {
      const v = hex.replace("#", "");
      const n = parseInt(v.length === 3 ? v.split("").map(x => x+x).join("") : v, 16);
      return [(n>>16)&255, (n>>8)&255, n&255];
    };

    const rgba = (hex, alpha = 1) => {
      const [r,g,b] = hexToRgb(hex);
      return `rgba(${r},${g},${b},${alpha})`;
    };

    const shade = (hex, factor = 1) => {
      const [r,g,b] = hexToRgb(hex);
      return `rgb(${Math.round(clamp(r*factor,0,255))},${Math.round(clamp(g*factor,0,255))},${Math.round(clamp(b*factor,0,255))})`;
    };

    const canvas = document.querySelector("#scene");
    const ctx = canvas.getContext("2d");
    const experience = document.querySelector("#experience");
    const copy = document.querySelector("#copy");
    const replay = document.querySelector("#replay");
    const progress = document.querySelector("#progress");
    const hint = document.querySelector("#hint");
    const wishButton = document.querySelector("#wishButton");
    const secretMessage = document.querySelector("#secretMessage");

    document.documentElement.style.setProperty("--violet", CONFIG.primary);
    document.documentElement.style.setProperty("--cyan", CONFIG.secondary);
    document.documentElement.style.setProperty("--gold", CONFIG.accent);
    document.querySelector("#eyebrow").textContent = CONFIG.eyebrow;
    document.querySelector("#recipient").textContent = `TO ${CONFIG.name}  ♡`;
    document.querySelector("#title").innerHTML = CONFIG.greeting.split(" ").join("<br>");
    document.querySelector("#wish").innerHTML = CONFIG.messageCN.replace(/\n/g, "<br>");
    document.querySelector("#messageEn").textContent = CONFIG.messageEN;
    document.querySelector("#birthdayDate").textContent = CONFIG.birthday;
    secretMessage.textContent = CONFIG.hiddenWish;
    document.title = `${CONFIG.greeting} · ${CONFIG.name}`;

    const state = {
      width: 0,
      height: 0,
      dpr: 1,
      start: performance.now(),
      last: performance.now(),
      elapsed: 0,
      cycle: 0,
      raf: 0,
      stars: [],
      dust: [],
      particles: [],
      orbiters: [],
      shootingStars: [],
      bursts: new Set(),
      finalShown: false,
      wishGlow: 0,
      flameImpulse: 0,
      reducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches
    };

    class RNG {
      constructor(seed = 1977) { this.seed = seed >>> 0; }
      next() { this.seed = (1664525 * this.seed + 1013904223) >>> 0; return this.seed / 4294967296; }
      range(min, max) { return lerp(min, max, this.next()); }
      pick(items) { return items[Math.floor(this.next()*items.length)]; }
    }

    class Particle {
      constructor(x, y, rng, kind = "spark", intensity = 1) {
        const a = rng.range(-Math.PI*.94, -Math.PI*.06);
        const speed = rng.range(.035, .15) * intensity;
        this.x = x; this.y = y;
        this.vx = Math.cos(a) * speed;
        this.vy = Math.sin(a) * speed;
        this.gravity = rng.range(.000055, .00016);
        this.drag = rng.range(.988, .997);
        this.life = 0;
        this.maxLife = rng.range(900, 2200);
        this.size = rng.range(1.4, 4.5) * (kind === "star" ? 1.25 : 1);
        this.rot = rng.range(0, TAU);
        this.spin = rng.range(-.006, .006);
        this.depth = rng.range(.55, 1.65);
        this.blur = this.depth > 1.3 ? rng.range(1.5, 4.5) : (this.depth < .7 ? rng.range(.5, 1.4) : 0);
        const colorRoll = rng.next();
        this.color = colorRoll < .48 ? CONFIG.accent : colorRoll < .67 ? "#fff0c9" : colorRoll < .82 ? CONFIG.primary : colorRoll < .92 ? "#e9a2cb" : CONFIG.secondary;
        this.kind = kind;
      }
      update(dt) {
        this.life += dt;
        this.vx *= Math.pow(this.drag, dt/16.67);
        this.vy = this.vy * Math.pow(this.drag, dt/16.67) + this.gravity * dt;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.rot += this.spin * dt;
      }
      draw(ctx, scale) {
        const p = clamp(this.life/this.maxLife);
        const alpha = Math.sin(p*Math.PI) * .92;
        const s = this.size * scale * this.depth * (1 + p*.25);
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = state.width < 700 ? 0 : (this.kind === "confetti" ? 2*scale : 4*scale);
        // Avoid per-particle blur on the per-frame path.
        if (this.kind === "orb") {
          ctx.globalAlpha = alpha * .34;
          const g = ctx.createRadialGradient(0,0,0,0,0,s*2.2);
          g.addColorStop(0,rgba(this.color,.7)); g.addColorStop(.5,rgba(this.color,.18)); g.addColorStop(1,rgba(this.color,0));
          ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,s*2.2,0,TAU); ctx.fill();
        }
        else if (this.kind === "star") drawStar(ctx, 0, 0, s, s*.42, 4);
        else if (this.kind === "confetti") ctx.fillRect(-s*.8, -s*.25, s*1.6, s*.5);
        else { ctx.beginPath(); ctx.arc(0, 0, s*.48, 0, TAU); ctx.fill(); }
        ctx.restore();
      }
      get dead() { return this.life >= this.maxLife; }
    }

    function resize() {
      const rect = experience.getBoundingClientRect();
      if (Math.abs(rect.width-state.width)<1 && Math.abs(rect.height-state.height)<1) return;
      state.dpr = Math.min(devicePixelRatio || 1, rect.width < 700 ? 1.5 : 1.75, Math.sqrt(1700000 / (rect.width * rect.height)));
      state.width = rect.width;
      state.height = rect.height;
      canvas.width = Math.round(rect.width * state.dpr);
      canvas.height = Math.round(rect.height * state.dpr);
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      seedScene();
    }

    function seedScene() {
      const rng = new RNG(20260829 + Math.round(state.width));
      const count = Math.round(clamp(state.width*state.height/8500, 65, 160));
      state.stars = Array.from({length: count}, (_, i) => ({
        x: rng.next(), y: rng.next(), r: rng.range(.3, 1.35),
        phase: rng.range(0, TAU), speed: rng.range(.35, 1.25),
        alpha: rng.range(.16, .72), warm: rng.next() > .91
      }));
      state.dust = Array.from({length: 12}, () => ({
        x: rng.next(), y: rng.range(.16, .88), r: rng.range(22, 76),
        color: rng.pick([CONFIG.primary, "#e99bc5", CONFIG.accent, "#7749af"]),
        alpha: rng.range(.012, .035)
      }));
      state.orbiters = Array.from({length: 18}, (_, i) => ({
        orbit: i % 3,
        phase: rng.range(0, TAU),
        speed: rng.range(.18, .38) * (rng.next()>.5?1:-1),
        size: rng.range(.7, 2.2),
        color: rng.next()<.62?CONFIG.accent:rng.pick([CONFIG.primary,"#efb6d6","#fff4d7"])
      }));
    }

    function drawStar(ctx, x, y, outer, inner, points = 5) {
      ctx.beginPath();
      for (let i=0; i<points*2; i++) {
        const r = i%2 ? inner : outer;
        const a = -Math.PI/2 + i*Math.PI/points;
        const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    }

    const backgroundCanvas=document.createElement('canvas');
    const backgroundContext=backgroundCanvas.getContext('2d');
    function cacheBackground() {
      backgroundCanvas.width=canvas.width; backgroundCanvas.height=canvas.height;
      backgroundContext.setTransform(state.dpr,0,0,state.dpr,0,0);
      const t=1;
      const w = state.width, h = state.height;
      const portrait = h/w > 1.25;
      const cx = portrait ? w*.5 : w*.70;
      const cy = portrait ? h*.60 : h*.53;

      const bloom = backgroundContext.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w,h)*.55);
      bloom.addColorStop(0, rgba(CONFIG.primary, .12 + smoothstep(.16,.58,t)*.08));
      bloom.addColorStop(.32, rgba(CONFIG.secondary, .035));
      bloom.addColorStop(1, "rgba(0,0,0,0)");
      backgroundContext.fillStyle = bloom; backgroundContext.fillRect(0,0,w,h);

      for (const d of state.dust) {
        const g = backgroundContext.createRadialGradient(d.x*w, d.y*h, 0, d.x*w, d.y*h, d.r);
        g.addColorStop(0, rgba(d.color, d.alpha)); g.addColorStop(1, rgba(d.color, 0));
        backgroundContext.fillStyle = g; backgroundContext.fillRect(d.x*w-d.r, d.y*h-d.r, d.r*2, d.r*2);
      }

      // Restrained defocused foreground lights add depth without turning into neon clutter.
      const bokehAlpha=smoothstep(.18,.48,t);
      for(let i=0;i<7;i++){
        const bx=((i*0.173+.08)%1)*w,by=((i*.287+.21)%1)*h;
        const br=(i%3===0?20:9)*Math.min(w/540,1.45);
        const bg=backgroundContext.createRadialGradient(bx,by,0,bx,by,br);
        const bc=i%2?"#e5a0c5":CONFIG.accent;
        bg.addColorStop(0,rgba(bc,.055*bokehAlpha));bg.addColorStop(.42,rgba(bc,.018*bokehAlpha));bg.addColorStop(1,rgba(bc,0));
        backgroundContext.fillStyle=bg;backgroundContext.beginPath();backgroundContext.arc(bx,by,br,0,TAU);backgroundContext.fill();
      }

    }
    function drawBackground(time,t) {
      if(backgroundCanvas.width!==canvas.width || backgroundCanvas.height!==canvas.height) cacheBackground();
      ctx.drawImage(backgroundCanvas,0,0,state.width,state.height);
      const w=state.width,h=state.height;
      const starReveal = easeOutCubic(clamp(t/.18));
      for (const s of state.stars) {
        const flicker = .62 + .38*Math.sin(time*.001*s.speed + s.phase);
        ctx.globalAlpha = s.alpha * flicker * starReveal;
        ctx.fillStyle = s.warm ? CONFIG.accent : "#e8ebff";
        ctx.beginPath(); ctx.arc(s.x*w, s.y*h, s.r, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function cakeLayout() {
      const w = state.width, h = state.height;
      const portrait = h/w > 1.25;
      const scale = Math.min(w/520, h/880);
      const ratio = cakeAsset.naturalWidth && cakeAsset.naturalHeight ? cakeAsset.naturalWidth/cakeAsset.naturalHeight : .833;
      const assetH = portrait
        ? Math.min(h*.49, w*.88/ratio)
        : Math.min(h*.84, w*.58/ratio);
      const assetW = assetH*ratio;
      const centerY = portrait ? h*.64 : h*.56;
      return {
        portrait, scale,
        x: portrait ? w*.5 : w*.70,
        y: centerY + assetH*.32,
        centerY,
        assetW, assetH,
        width: assetW*.67,
        height: assetH*.52
      };
    }

    function ellipseGradient(x, y, rx, ry, c1, c2) {
      const g = ctx.createLinearGradient(x-rx, y-ry, x+rx, y+ry);
      g.addColorStop(0, c1); g.addColorStop(.48, c2); g.addColorStop(1, c1);
      return g;
    }

    function drawCake(time, t) {
      if (!cakeAsset.complete || !cakeAsset.naturalWidth) return drawCakeProcedural(time,t);
      const L = cakeLayout();
      const appear = easeOutCubic(clamp((t-.06)/.2));
      if (!appear) return;
      const glow = smoothstep(.12,.38,t);
      const breathe = 1 + Math.sin(time*.00105)*.007 + smoothstep(.68,.94,t)*.014;
      const floatY = Math.sin(time*.00115)*3.2*L.scale + (1-appear)*42*L.scale;
      const w = L.assetW*breathe, h = L.assetH*breathe;
      const left = L.x-w/2, top = L.centerY-h/2+floatY;

      ctx.save();
      ctx.globalAlpha = appear;
      const aura = ctx.createRadialGradient(L.x,L.centerY-h*.14,0,L.x,L.centerY-h*.05,w*.72);
      aura.addColorStop(0,rgba(CONFIG.primary,.24*glow));
      aura.addColorStop(.42,rgba("#7b43b7",.11*glow));
      aura.addColorStop(.76,rgba(CONFIG.accent,.035*glow));
      aura.addColorStop(1,rgba(CONFIG.primary,0));
      ctx.fillStyle=aura;ctx.fillRect(L.x-w*.95,L.centerY-h*.72,w*1.9,h*1.45);

      ctx.save();ctx.translate(L.x,L.centerY+h*.43+floatY);ctx.scale(1,.17);
      const shadow=ctx.createRadialGradient(0,0,0,0,0,w*.53);
      shadow.addColorStop(0,"rgba(37,21,70,.48)");shadow.addColorStop(.68,"rgba(168,109,189,.12)");shadow.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=shadow;ctx.beginPath();ctx.arc(0,0,w*.53,0,TAU);ctx.fill();ctx.restore();

      ctx.shadowColor=rgba(CONFIG.primary,.28);ctx.shadowBlur=0;
      ctx.drawImage(cakeAsset,left,top,w,h);
      ctx.shadowBlur=0;

      // Warm candle illumination gently washes the upper frosting.
      ctx.globalCompositeOperation="screen";
      const warm=ctx.createRadialGradient(L.x,top+h*.11,0,L.x,top+h*.11,w*.34);
      warm.addColorStop(0,rgba("#ffc46e",(.12+state.wishGlow*.11)*glow));
      warm.addColorStop(.36,rgba("#f5a8be",.045*glow));
      warm.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=warm;ctx.fillRect(L.x-w*.42,top-h*.03,w*.84,h*.39);
      ctx.restore();

      const candleTipY=top+h*.027;
      drawFlame(L.x,candleTipY,time,L.scale*1.15,glow);
    }

    // Lightweight procedural fallback keeps the page functional if the asset is missing.
    function drawCakeProcedural(time, t) {
      const L = cakeLayout();
      const appear = easeOutCubic(clamp((t-.06)/.19));
      if (appear <= 0) return;
      const glow = smoothstep(.14,.36,t);
      const s = L.scale;
      const floatY = Math.sin(time*.00125)*3*s;
      const x = L.x, baseY = L.y + floatY + (1-appear)*55*s;
      const W = L.width;
      const tierH = [74, 62, 50].map(v=>v*s);
      const widths = [W, W*.73, W*.48];

      ctx.save();
      ctx.globalAlpha = appear;

      const aura = ctx.createRadialGradient(x, baseY-90*s, 0, x, baseY-60*s, W*.88);
      aura.addColorStop(0, rgba(CONFIG.primary, .18*glow));
      aura.addColorStop(.42, rgba(CONFIG.secondary, .06*glow));
      aura.addColorStop(1, rgba(CONFIG.primary, 0));
      ctx.fillStyle = aura; ctx.fillRect(x-W, baseY-W, W*2, W*1.7);

      // Ground shadow
      ctx.save(); ctx.translate(x, baseY+10*s); ctx.scale(1,.18);
      const shadow = ctx.createRadialGradient(0,0,0,0,0,W*.62);
      shadow.addColorStop(0,"rgba(118,96,255,.33)"); shadow.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=shadow; ctx.beginPath(); ctx.arc(0,0,W*.62,0,TAU); ctx.fill(); ctx.restore();

      let y = baseY - tierH[0];
      for (let i=0; i<3; i++) {
        const tw = widths[i], th = tierH[i], eh = 19*s;
        const left = x-tw/2;
        // body
        const body = ctx.createLinearGradient(left,0,left+tw,0);
        body.addColorStop(0,shade(CONFIG.primary,.31));
        body.addColorStop(.17,shade(CONFIG.primary,i===1?.74:.65));
        body.addColorStop(.5,shade(CONFIG.primary,i===2?1.08:.9));
        body.addColorStop(.78,shade(CONFIG.primary,.57)); body.addColorStop(1,shade(CONFIG.primary,.22));
        ctx.fillStyle=body; ctx.beginPath();
        ctx.moveTo(left,y); ctx.lineTo(left,y+th-eh/2);
        ctx.bezierCurveTo(left,y+th+eh/2,left+tw,y+th+eh/2,left+tw,y+th-eh/2);
        ctx.lineTo(left+tw,y); ctx.closePath(); ctx.fill();
        // top rim
        ctx.fillStyle=ellipseGradient(x,y,tw/2,eh,shade(CONFIG.primary,.62), i===2?shade(CONFIG.primary,1.14):shade(CONFIG.primary,.91));
        ctx.shadowColor=rgba(CONFIG.primary,.55); ctx.shadowBlur=12*s*glow;
        ctx.beginPath(); ctx.ellipse(x,y,tw/2,eh,0,0,TAU); ctx.fill(); ctx.shadowBlur=0;
        // glaze highlight
        const hi=ctx.createLinearGradient(left,y,left+tw,y);
        hi.addColorStop(0,"rgba(255,255,255,0)"); hi.addColorStop(.43,"rgba(220,215,255,.17)"); hi.addColorStop(.62,"rgba(255,255,255,.05)"); hi.addColorStop(1,"rgba(255,255,255,0)");
        ctx.fillStyle=hi; ctx.fillRect(left+1,y+eh*.15,tw-2,Math.max(2,th*.12));
        // tiny constellations on each tier
        const count=5-i;
        for(let k=0;k<count;k++) {
          const px=left+tw*(.12+(k+.35)/(count+.25));
          const py=y+th*(.38+.23*Math.sin(k*2.1+i));
          ctx.fillStyle=k%3===0?CONFIG.accent:"rgba(221,220,255,.68)";
          ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=7*s;
          if((k+i)%2===0) drawStar(ctx,px,py,2.6*s,1.1*s,4);
          else {ctx.beginPath();ctx.arc(px,py,1.4*s,0,TAU);ctx.fill();}
        }
        ctx.shadowBlur=0;
        y -= i<2 ? tierH[i+1]*.94 : 0;
      }

      // Candle
      const candleTop = y - 41*s;
      const candleW=12*s, candleH=42*s;
      const cg=ctx.createLinearGradient(x-candleW/2,0,x+candleW/2,0);
      cg.addColorStop(0,shade(CONFIG.primary,.66));cg.addColorStop(.42,shade(CONFIG.primary,1.42));cg.addColorStop(.65,shade(CONFIG.primary,1.02));cg.addColorStop(1,shade(CONFIG.primary,.45));
      ctx.fillStyle=cg;ctx.beginPath();ctx.roundRect(x-candleW/2,candleTop,candleW,candleH,[4*s,4*s,2*s,2*s]);ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.28)";ctx.lineWidth=.8*s;ctx.beginPath();ctx.moveTo(x,candleTop);ctx.lineTo(x,candleTop+candleH);ctx.stroke();

      drawFlame(x,candleTop-3*s,time,s,glow);
      ctx.restore();
    }

    function drawFlame(x,y,time,s,intensity) {
      const impulse=state.flameImpulse;
      const flicker=Math.sin(time*.012)*1.6+Math.sin(time*.023)*.8+Math.sin(time*.035)*5*impulse;
      const h=(25+Math.sin(time*.017)*2.4+impulse*2.5)*s;
      ctx.save();ctx.translate(x+flicker*s,y);
      const halo=ctx.createRadialGradient(0,-h*.45,0,0,-h*.4,47*s);
      halo.addColorStop(0,rgba(CONFIG.accent,(.25+state.wishGlow*.18)*intensity));halo.addColorStop(1,rgba(CONFIG.accent,0));
      ctx.fillStyle=halo;ctx.fillRect(-50*s,-62*s,100*s,92*s);
      ctx.shadowColor=CONFIG.accent;ctx.shadowBlur=17*s;
      const g=ctx.createLinearGradient(0,-h,0,0);
      g.addColorStop(0,"#fff9d6");g.addColorStop(.44,"#ffe17d");g.addColorStop(1,"#ff8d58");
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-h);ctx.bezierCurveTo(10*s,-h*.64,9*s,-h*.14,0,0);ctx.bezierCurveTo(-9*s,-h*.14,-8*s,-h*.64,0,-h);ctx.fill();
      ctx.shadowBlur=4*s;ctx.fillStyle="#fffbd8";ctx.beginPath();ctx.ellipse(0,-h*.3,2.7*s,6*s,0,0,TAU);ctx.fill();ctx.restore();
    }

    function drawOrbits(time,t,layer="back") {
      const L=cakeLayout();
      const reveal=smoothstep(.27,.48,t) * (1-smoothstep(.91,1,t)*.35);
      if(!reveal)return;
      const configs=[
        {rx:L.assetW*.66,ry:L.assetH*.12,rot:-.17,color:CONFIG.accent,speed:.72},
        {rx:L.assetW*.58,ry:L.assetH*.17,rot:.28,color:"#d79ae6",speed:-.48},
        {rx:L.assetW*.49,ry:L.assetH*.22,rot:-.48,color:"#e9b467",speed:.34}
      ];
      const centerY=L.centerY+L.assetH*.02;
      const boost=1+state.wishGlow*1.2;
      ctx.save();ctx.globalAlpha=reveal;
      configs.forEach((o,i)=>{
        ctx.save();ctx.translate(L.x,centerY);ctx.rotate(o.rot);
        const phase=time*.00012*o.speed+i*1.7;
        ctx.lineWidth=(i===0?1.25:.75)*L.scale;
        ctx.strokeStyle=rgba(o.color,(layer==="front"?.38:.16)*boost);
        ctx.shadowColor=o.color;ctx.shadowBlur=(layer==="front"?3:0)*L.scale*boost;
        ctx.beginPath();
        let drawing=false;
        for(let a=0;a<=TAU+.12;a+=.12){
          const depth=Math.sin(a);
          const layerMatch=layer==="front"?depth>=0:depth<0;
          const gap=Math.sin(a*2.6+phase+i*.8)>-.58;
          const px=Math.cos(a)*o.rx,py=Math.sin(a)*o.ry;
          if(layerMatch&&gap){drawing?ctx.lineTo(px,py):ctx.moveTo(px,py);drawing=true;}else drawing=false;
        }
        ctx.stroke();ctx.restore();
      });

      for(const p of state.orbiters){
        const o=configs[p.orbit];
        const a=p.phase+time*.001*p.speed;
        let px=Math.cos(a)*o.rx, py=Math.sin(a)*o.ry;
        const cos=Math.cos(o.rot),sin=Math.sin(o.rot);
        const x=L.x+px*cos-py*sin,y=centerY+px*sin+py*cos;
        const depth=.5+.5*Math.sin(a);
        const isFront=depth>=.5;
        if((layer==="front")!==isFront)continue;
        ctx.globalAlpha=reveal*(.22+.78*depth)*boost;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=(2+depth*2)*L.scale;
        ctx.beginPath();ctx.arc(x,y,p.size*L.scale*(.65+.4*depth),0,TAU);ctx.fill();
      }
      ctx.restore();ctx.globalAlpha=1;ctx.setLineDash([]);
    }

    function spawnAmbient(t, dt) {
      const L=cakeLayout();
      const active=fadeWindow(t,.34,.9,.1);
      if(active<=0 || state.reducedMotion || state.particles.length>55)return;
      const rate=lerp(4,12,smoothstep(.42,.7,t))*active;
      if(Math.random()<rate*dt/1000){
        const rng=new RNG((performance.now()*1000+Math.random()*1e8)|0);
        const roll=rng.next(),kind=roll<.30?"star":roll<.42?"orb":roll<.48?"confetti":"spark";
        state.particles.push(new Particle(L.x+rng.range(-L.assetW*.18,L.assetW*.18),L.centerY-L.assetH*.30+rng.range(-28,32)*L.scale,rng,kind,.72));
      }
    }

    function burst(x,y,count=48,intensity=1) {
      const rng=new RNG((Date.now()+x*17+y*23)|0);
      if(state.reducedMotion)return;
      count=Math.min(Math.round(count*(state.width<700?.55:1)),Math.max(0,90-state.particles.length));
      for(let i=0;i<count;i++){
        const n=rng.next(),kind=n<.28?"star":n<.37?"orb":n<.46?"confetti":"spark";
        state.particles.push(new Particle(x,y,rng,kind,intensity));
      }
    }

    function drawParticles(dt) {
      const scale=cakeLayout().scale;
      for(let i=state.particles.length-1;i>=0;i--){
        const p=state.particles[i];p.update(dt);p.draw(ctx,scale);
        if(p.dead)state.particles.splice(i,1);
      }
    }

    function shootingStar(x,y) {
      if(state.reducedMotion || state.shootingStars.length>=8)return;
      state.shootingStars.push({x,y,vx:-.34,vy:.18,life:0,maxLife:850,color:Math.random()>.5?CONFIG.secondary:CONFIG.accent});
    }

    function drawShootingStars(dt) {
      for(let i=state.shootingStars.length-1;i>=0;i--){
        const s=state.shootingStars[i];s.life+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
        const a=Math.sin(clamp(s.life/s.maxLife)*Math.PI);
        const g=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*180,s.y-s.vy*180);
        g.addColorStop(0,rgba(s.color,a));g.addColorStop(1,rgba(s.color,0));
        ctx.strokeStyle=g;ctx.lineWidth=1.4;ctx.shadowColor=s.color;ctx.shadowBlur=8;
        ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*180,s.y-s.vy*180);ctx.stroke();ctx.shadowBlur=0;
        if(s.life>s.maxLife)state.shootingStars.splice(i,1);
      }
    }

    function resetAnimation() {
      closeWishStage(false);state.wishMade=false;
      state.start=performance.now();state.last=state.start;state.elapsed=0;state.cycle++;
      state.particles=[];state.shootingStars=[];state.bursts.clear();state.finalShown=false;
      state.wishGlow=0;state.flameImpulse=0;
      if(state.reducedMotion)state.elapsed=CONFIG.duration;
      resumeScene();
      secretMessage.classList.remove("visible");
      wishButton.classList.remove("visible");
      wishButton.innerHTML='<span class="spark">✦</span>Make a Wish';
      copy.classList.remove("show-final");replay.classList.remove("visible");hint.classList.remove("visible");
      requestAnimationFrame(()=>copy.classList.add("show-intro"));
    }

    function frame(now) {
      state.raf=0;
      if(document.hidden || experience.classList.contains("wish-phase"))return;
      const elapsed=Math.min(100,Math.max(0,now-state.last));
      const dt=Math.min(34,elapsed);state.last=now;state.elapsed+=elapsed;
      const seconds=state.elapsed/1000;
      const t=clamp(state.elapsed/CONFIG.duration);
      state.wishGlow=Math.max(0,state.wishGlow-dt*.00024);
      state.flameImpulse=Math.max(0,state.flameImpulse-dt*.0007);
      ctx.clearRect(0,0,state.width,state.height);

      drawBackground(now,t);
      drawOrbits(now,t,"back");
      drawCake(now,t);
      drawOrbits(now,t,"front");

      const L=cakeLayout();
      if(t>.45 && !state.bursts.has(1)){burst(L.x,L.centerY-L.assetH*.22,22,.72);state.bursts.add(1);}
      if(t>.63 && !state.bursts.has(2)){burst(L.x,L.centerY-L.assetH*.10,34,.88);state.bursts.add(2);}
      if(t>.79 && !state.bursts.has(3)){burst(L.x,L.centerY-L.assetH*.24,18,.62);state.bursts.add(3);}
      if(t>.35 && !state.bursts.has(4)){shootingStar(state.width*.92,state.height*.18);state.bursts.add(4);}
      spawnAmbient(t,dt);drawParticles(dt);drawShootingStars(dt);

      progress.style.width=`${t*100}%`;
      if(t>.54 && !state.finalShown){copy.classList.add("show-final");wishButton.classList.add("visible");state.finalShown=true;}
      if(t>.92){replay.classList.add("visible");hint.classList.add("visible");}

      if(seconds>=CONFIG.duration/1000+CONFIG.loopPause && CONFIG.loop && !state.wishMade) resetAnimation();
      if(!state.reducedMotion)state.raf=requestAnimationFrame(frame);
    }

    function resumeScene(){if(!document.hidden && !state.raf){state.last=performance.now();state.raf=requestAnimationFrame(frame)}}
    document.addEventListener("visibilitychange",()=>{if(document.hidden){cancelAnimationFrame(state.raf);state.raf=0}else resumeScene()});
    replay.addEventListener("click", resetAnimation);
    const wishReveal=document.querySelector('#wishReveal'),wishReturn=document.querySelector('#wishReturn');
    let wishTimers=[];
    function closeWishStage(focus=true){wishTimers.forEach(clearTimeout);wishTimers=[];wishReveal.classList.remove('active');wishReveal.setAttribute('aria-hidden','true');wishReveal.inert=true;experience.classList.remove('wish-phase');resumeScene();if(focus)wishButton.focus();}
    wishReturn.addEventListener('click',()=>closeWishStage());
    wishReveal.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeWishStage()}if(e.key==='Tab'){e.preventDefault();wishReturn.focus()}});
    document.addEventListener('keydown',e=>{if(!wishReveal.classList.contains('active'))return;if(e.key==='Escape'){e.preventDefault();closeWishStage()}else if(e.key==='Tab'){e.preventDefault();wishReturn.focus()}});
    wishButton.addEventListener('click',e=>{
      e.stopPropagation();closeWishStage(false);state.wishMade=true;state.wishGlow=1;state.flameImpulse=1;
      document.querySelector('#wishRevealText').textContent=CONFIG.hiddenWish;
      const dust=document.querySelector('#wishDust');dust.replaceChildren();
      for(let i=0;i<(state.width<700?24:36);i++){const p=document.createElement('i');p.textContent=i%4?'✧':'✦';p.style.setProperty('--x',((i*37)%100)+'%');p.style.setProperty('--y',((i*53)%90+5)+'%');p.style.setProperty('--size',(8+i%5*3)+'px');p.style.setProperty('--delay',(i%9*.13)+'s');dust.append(p)}
      wishReveal.inert=false;wishReveal.setAttribute('aria-hidden','false');wishReveal.classList.add('active');experience.classList.add('wish-phase');wishTimers.push(setTimeout(()=>{if(wishReveal.classList.contains('active'))wishReturn.focus()},80));
      const sparkle=()=>{const L=cakeLayout();burst(L.x,L.centerY-L.assetH*.28,75,1.2);shootingStar(state.width*.92,state.height*.18);shootingStar(state.width*.72,state.height*.1)};sparkle();
      if(!matchMedia('(prefers-reduced-motion: reduce)').matches)for(let i=1;i<4;i++)wishTimers.push(setTimeout(sparkle,i*600));
      secretMessage.classList.add('visible');wishButton.innerHTML='<span class="spark">✦</span>Make Another Wish';
    });
    experience.addEventListener("pointerdown", e=>{
      if(!CONFIG.interactiveSparkles || e.target.closest("button"))return;
      const r=experience.getBoundingClientRect();
      burst(e.clientX-r.left,e.clientY-r.top,26,.68);
      shootingStar(e.clientX-r.left+state.width*.26,e.clientY-r.top-state.height*.1);
    });

    addEventListener("resize",resize,{passive:true});
    new ResizeObserver(resize).observe(experience);
    cakeAsset.decode().catch(()=>{}).finally(()=>{
      resize();resetAnimation();resumeScene();
    });
