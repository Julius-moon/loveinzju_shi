<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf5eb"><title>大家的悄悄话 · 爱在ZJU</title><link rel="stylesheet" href="assets/gift.css"><link rel="stylesheet" href="assets/keepsakes.css"><script defer src="assets/gift.js"></script><script defer src="assets/letters.js"></script></head><body class="letters-page"><header class="gift-header"><a class="back-link" href="index.html#gifts">← 返回礼物</a><span class="letter-spacing">LETTERS, JUST FOR YOU</span><div class="gift-tools"><button class="tool-button" id="writeLetter">试写一封 ✎</button><a class="tool-button" href="contact.html?product=letters">定制这份 ↗</a></div></header>
<main class="letters-main"><section class="letters-heading"><span class="tiny-eyebrow">TO 小满 · FROM ALL OF US</span><h1>有些话，<span>想悄悄说给你听。</span></h1><p>我们各自写了一封信，<br>等你一封一封，慢慢拆开。</p><span id="letterCounter" class="letter-counter" aria-live="polite">已经拆开 0 / 6 份心意</span></section>
<section class="envelope-grid" aria-label="六位朋友写来的信">
<button class="envelope" data-letter="0" style="--envelope:#f0c4ba;--angle:-4deg" aria-label="打开来自小林的信"><span class="envelope-front"></span><span class="envelope-flap"></span><span class="envelope-label"><small>来自 小林</small><b>谢谢你的偏爱。</b></span><span class="envelope-seal" aria-hidden="true">♡</span><span class="envelope-read">已收藏 ✓</span></button>
<button class="envelope" data-letter="1" style="--envelope:#c5d2e8;--angle:3deg" aria-label="打开来自阿禾的信"><span class="envelope-front"></span><span class="envelope-flap"></span><span class="envelope-label"><small>来自 阿禾</small><b>下次也一起。</b></span><span class="envelope-seal" aria-hidden="true">✧</span><span class="envelope-read">已收藏 ✓</span></button>
<button class="envelope" data-letter="2" style="--envelope:#f3dfa6;--angle:-2deg" aria-label="打开来自室友们的信"><span class="envelope-front"></span><span class="envelope-flap"></span><span class="envelope-label"><small>来自 室友们</small><b>今晚早点睡。</b></span><span class="envelope-seal" aria-hidden="true">☺</span><span class="envelope-read">已收藏 ✓</span></button>
<button class="envelope" data-letter="3" style="--envelope:#cadcc5;--angle:3deg" aria-label="打开来自小许的信"><span class="envelope-front"></span><span class="envelope-flap"></span><span class="envelope-label"><small>来自 小许</small><b>这段路，谢谢你。</b></span><span class="envelope-seal" aria-hidden="true">❀</span><span class="envelope-read">已收藏 ✓</span></button>
<button class="envelope" data-letter="4" style="--envelope:#dbceea;--angle:-3deg" aria-label="打开来自阿澈的信"><span class="envelope-front"></span><span class="envelope-flap"></span><span class="envelope-label"><small>来自 阿澈</small><b>不止这一年。</b></span><span class="envelope-seal" aria-hidden="true">♡</span><span class="envelope-read">已收藏 ✓</span></button>
<button class="envelope" data-letter="5" style="--envelope:#ecd2b5;--angle:4deg" aria-label="打开写给未来的信"><span class="envelope-front"></span><span class="envelope-flap"></span><span class="envelope-label"><small>来自 未来的我们</small><b>慢慢来，也很好。</b></span><span class="envelope-seal" aria-hidden="true">✉</span><span class="envelope-read">已收藏 ✓</span></button>
</section><section class="letters-actions"><p id="letterHint">轻点一个信封，<br>听听大家没来得及当面说的话。</p><button id="collectLetters" class="coral-button" disabled>拆完以后，把祝福拼在一起 ♡</button><a href="contact.html?product=letters">想收集你们的祝福？联系我们 ↗</a></section><section class="blessing-wall" id="blessingWall" hidden><h2 tabindex="-1" id="wallTitle">原来，你被这么多人惦记着。</h2><p>每个人的一小句，拼成很大的一份心意。</p><div class="wall-grid" id="wallGrid"></div></section></main>
<footer class="gift-bottom"><span>爱在ZJU · 心意可以有很多种声音。</span><span>演示人物与信件 · <a href="contact.html?product=letters">联系我们 ↗</a></span></footer>
<dialog class="letter-dialog" id="letterDialog"><button class="close-dialog" data-close aria-label="合上信件">×</button><article class="letter-sheet"><p class="letter-date" id="letterDate"></p><h2 id="letterTitle"></h2><p class="letter-to">亲爱的小满，</p><p id="letterBody" class="letter-body"></p><img class="letter-image" id="letterImage" alt="随信附上的演示照片" hidden><p class="letter-from" id="letterFrom"></p><button class="letter-hidden-button" id="revealLetterSecret" aria-expanded="false">信的背面，还藏着一句话 ♡</button><p class="letter-private" id="letterPrivate" hidden></p></article><div class="letter-dialog-nav"><button id="previousLetter">← 上一封</button><span id="letterPosition"></span><button id="nextLetter">下一封 →</button></div></dialog>
<dialog class="edit-dialog" id="letterEditDialog"><button class="close-dialog" data-close aria-label="关闭写信">×</button><span class="letter-spacing">YOUR OWN LITTLE LETTER</span><h2>留一封，你想说的话。</h2><form id="letterForm"><label>你的称呼<input id="letterSenderInput" maxlength="20" value="未来的我们" required></label><label>信封上的一句话<input id="letterTitleInput" maxlength="24" value="慢慢来，也很好。" required></label><label>想写在信里的话<textarea id="letterBodyInput" rows="5" maxlength="800" required></textarea></label><label>藏在信背面的寄语<textarea id="letterSecretInput" rows="2" maxlength="120"></textarea></label><button type="submit" class="coral-button">装进第六个信封 ♡</button><p class="form-footnote">替换当前样片的第六封信。只在本次页面生效，不会发送。</p></form></dialog><div id="toast" class="toast" role="status"></div></body></html>
